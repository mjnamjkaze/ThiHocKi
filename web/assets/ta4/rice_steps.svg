<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 240" font-family="system-ui, 'Segoe UI', 'Segoe UI Emoji', 'Noto Color Emoji', Arial, sans-serif">
<rect width="340" height="240" fill="#fff"/>
<rect x="6" y="6" width="328" height="228" rx="16"
    fill="#fff" stroke="#2b2b2b" stroke-width="3"/><rect x="20" y="20" width="150" height="40" fill="#f0e6d6" stroke="#2b2b2b" stroke-width="2"/>
<text x="95" y="46.4" font-size="20" font-weight="700"
  text-anchor="middle" fill="#2b2b2b">Step</text><rect x="170" y="20" width="150" height="40" fill="#f0e6d6" stroke="#2b2b2b" stroke-width="2"/>
<text x="245" y="46.4" font-size="20" font-weight="700"
  text-anchor="middle" fill="#2b2b2b">What farmers do</text><rect x="20" y="60" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="95" y="86.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">1</text><rect x="170" y="60" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="245" y="86.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">soak the seeds</text><rect x="20" y="100" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="95" y="126.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">2</text><rect x="170" y="100" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="245" y="126.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">plant the shoots</text><rect x="20" y="140" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="95" y="166.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">3</text><rect x="170" y="140" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="245" y="166.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">flood the field</text><rect x="20" y="180" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="95" y="206.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">4</text><rect x="170" y="180" width="150" height="40" fill="#fff" stroke="#2b2b2b" stroke-width="2"/>
<text x="245" y="206.4" font-size="20" 
  text-anchor="middle" fill="#2b2b2b">harvest and dry</text>
</svg>
