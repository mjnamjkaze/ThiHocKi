<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
  <rect x="0" y="0" width="700" height="250" fill="#fff" rx="8"/>
  <!-- Đoạn thẳng chính A - B - C - D -->
  <line x1="60" y1="80" x2="640" y2="80" stroke="#333" stroke-width="4"/>
  <line x1="60" y1="66" x2="60" y2="94" stroke="#333" stroke-width="4"/>
  <line x1="350" y1="66" x2="350" y2="94" stroke="#333" stroke-width="4"/>
  <line x1="423" y1="66" x2="423" y2="94" stroke="#333" stroke-width="4"/>
  <line x1="640" y1="66" x2="640" y2="94" stroke="#333" stroke-width="4"/>
  <text x="60" y="125" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="bold" fill="#333">A</text>
  <text x="345" y="125" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="bold" fill="#333">B</text>
  <text x="430" y="125" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="bold" fill="#333">C</text>
  <text x="640" y="125" text-anchor="middle" font-family="system-ui" font-size="30" font-weight="bold" fill="#333">D</text>
  <!-- Kích thước AC = 25 cm -->
  <line x1="60" y1="155" x2="423" y2="155" stroke="#e53935" stroke-width="2.5"/>
  <line x1="60" y1="147" x2="60" y2="163" stroke="#e53935" stroke-width="2.5"/>
  <line x1="423" y1="147" x2="423" y2="163" stroke="#e53935" stroke-width="2.5"/>
  <text x="200" y="148" text-anchor="middle" font-family="system-ui" font-size="22" fill="#e53935">AC = 25 cm</text>
  <!-- Kích thước BD = 20 cm -->
  <line x1="350" y1="190" x2="640" y2="190" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="350" y1="182" x2="350" y2="198" stroke="#1565c0" stroke-width="2.5"/>
  <line x1="640" y1="182" x2="640" y2="198" stroke="#1565c0" stroke-width="2.5"/>
  <text x="540" y="183" text-anchor="middle" font-family="system-ui" font-size="22" fill="#1565c0">BD = 20 cm</text>
  <!-- Kích thước AD = 40 cm -->
  <line x1="60" y1="228" x2="640" y2="228" stroke="#43a047" stroke-width="2.5"/>
  <line x1="60" y1="220" x2="60" y2="236" stroke="#43a047" stroke-width="2.5"/>
  <line x1="640" y1="220" x2="640" y2="236" stroke="#43a047" stroke-width="2.5"/>
  <text x="350" y="221" text-anchor="middle" font-family="system-ui" font-size="22" fill="#43a047">AD = 40 cm</text>
</svg>
