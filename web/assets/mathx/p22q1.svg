<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 340">
  <g stroke="#333" stroke-width="2" font-family="system-ui" font-size="26" text-anchor="middle">
    <!-- hàng trên cùng -->
    <rect x="320" y="45" width="60" height="52" fill="#ffe0e0"/>
    <text x="350" y="80" fill="#d32f2f" font-weight="bold" stroke="none">?</text>
    <!-- hàng 4: 2 ô -->
    <rect x="290" y="100" width="60" height="52" fill="#fff"/>
    <rect x="350" y="100" width="60" height="52" fill="#fff"/>
    <!-- hàng 3: 13, ?, 6 -->
    <rect x="260" y="155" width="60" height="52" fill="#fff9c4"/>
    <rect x="320" y="155" width="60" height="52" fill="#fff"/>
    <rect x="380" y="155" width="60" height="52" fill="#fff9c4"/>
    <text x="290" y="190" fill="#333" stroke="none">13</text>
    <text x="410" y="190" fill="#333" stroke="none">6</text>
    <!-- hàng 2: ?, 6, 2, ? -->
    <rect x="230" y="210" width="60" height="52" fill="#fff"/>
    <rect x="290" y="210" width="60" height="52" fill="#fff9c4"/>
    <rect x="350" y="210" width="60" height="52" fill="#fff9c4"/>
    <rect x="410" y="210" width="60" height="52" fill="#fff"/>
    <text x="320" y="245" fill="#333" stroke="none">6</text>
    <text x="380" y="245" fill="#333" stroke="none">2</text>
    <!-- hàng đáy: 2, 5, ?, 1, 3 -->
    <rect x="200" y="265" width="60" height="52" fill="#fff9c4"/>
    <rect x="260" y="265" width="60" height="52" fill="#fff9c4"/>
    <rect x="320" y="265" width="60" height="52" fill="#fff"/>
    <rect x="380" y="265" width="60" height="52" fill="#fff9c4"/>
    <rect x="440" y="265" width="60" height="52" fill="#fff9c4"/>
    <text x="230" y="300" fill="#333" stroke="none">2</text>
    <text x="290" y="300" fill="#333" stroke="none">5</text>
    <text x="410" y="300" fill="#333" stroke="none">1</text>
    <text x="470" y="300" fill="#333" stroke="none">3</text>
  </g>
</svg>
