<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220">
  <defs>
    <pattern id="soc" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#FFFFFF"/>
      <rect width="4" height="8" fill="#B0BEC5"/>
    </pattern>
  </defs>
  <g stroke="#333" stroke-width="2">
    <!-- hàng trên (trái sang phải: xám, sọc, xám, sọc, xám, sọc, xám) -->
    <rect x="10" y="10" width="40" height="40" fill="#757575"/>
    <rect x="50" y="10" width="40" height="40" fill="url(#soc)"/>
    <rect x="90" y="10" width="40" height="40" fill="#757575"/>
    <rect x="130" y="10" width="40" height="40" fill="url(#soc)"/>
    <rect x="170" y="10" width="40" height="40" fill="#757575"/>
    <rect x="210" y="10" width="40" height="40" fill="url(#soc)"/>
    <rect x="250" y="10" width="40" height="40" fill="#757575"/>
    <!-- hai cột bên -->
    <rect x="10" y="50" width="40" height="40" fill="url(#soc)"/>
    <rect x="250" y="50" width="40" height="40" fill="url(#soc)"/>
    <rect x="10" y="90" width="40" height="40" fill="#757575"/>
    <rect x="250" y="90" width="40" height="40" fill="#757575"/>
    <rect x="10" y="130" width="40" height="40" fill="url(#soc)"/>
    <rect x="250" y="130" width="40" height="40" fill="url(#soc)"/>
    <!-- hàng dưới -->
    <rect x="10" y="170" width="40" height="40" fill="#757575"/>
    <rect x="50" y="170" width="40" height="40" fill="url(#soc)"/>
    <rect x="90" y="170" width="40" height="40" fill="#757575"/>
    <rect x="130" y="170" width="40" height="40" fill="url(#soc)"/>
    <rect x="170" y="170" width="40" height="40" fill="#757575"/>
    <rect x="210" y="170" width="40" height="40" fill="url(#soc)"/>
    <rect x="250" y="170" width="40" height="40" fill="#757575"/>
  </g>
  <!-- phần ruột 5x3 viên bị mất (để trống) -->
</svg>
