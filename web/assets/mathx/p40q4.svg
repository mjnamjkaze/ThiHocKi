<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 230" font-family="system-ui">
  <rect x="0" y="0" width="700" height="230" fill="#fff" rx="8"/>
  <!-- hang tieu de: + 11 7 2 -->
  <text x="205" y="52" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">+</text>
  <text x="300" y="52" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">11</text>
  <text x="395" y="52" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">7</text>
  <text x="490" y="52" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">2</text>
  <!-- luoi 3x2 -->
  <rect x="253" y="70" width="285" height="140" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="348" y1="70" x2="348" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="443" y1="70" x2="443" y2="210" stroke="#333" stroke-width="3"/>
  <line x1="253" y1="140" x2="538" y2="140" stroke="#333" stroke-width="3"/>
  <!-- hang 1: 6 | 17 13 8 -->
  <text x="205" y="118" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">6</text>
  <text x="300" y="118" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">17</text>
  <text x="395" y="118" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">13</text>
  <text x="490" y="118" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">8</text>
  <!-- hang 2: vet muc che o dau hang va o thu nhat, ? o giua, 11 hien ro -->
  <path d="M150,158 q30,-16 90,-12 q80,4 140,6 q40,2 44,14 q2,14 -36,18 q-90,8 -170,2 q-60,-4 -72,-14 q-8,-8 4,-14 z" fill="#9e9e9e"/>
  <text x="395" y="190" font-size="38" fill="#fff" text-anchor="middle" font-weight="bold">?</text>
  <text x="490" y="190" font-size="38" fill="#333" text-anchor="middle" font-weight="bold">11</text>
</svg>
