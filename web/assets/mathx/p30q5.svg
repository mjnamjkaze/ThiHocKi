<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320">
  <rect x="0" y="0" width="320" height="320" fill="#fff" rx="8"/>
  <!-- Lưới trong (mảnh) -->
  <line x1="90" y1="20" x2="90" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="230" y1="20" x2="230" y2="300" stroke="#333" stroke-width="2.5"/>
  <line x1="20" y1="90" x2="300" y2="90" stroke="#333" stroke-width="2.5"/>
  <line x1="20" y1="230" x2="300" y2="230" stroke="#333" stroke-width="2.5"/>
  <!-- Lưới 2x2 (đậm) và khung ngoài -->
  <line x1="160" y1="20" x2="160" y2="300" stroke="#333" stroke-width="6"/>
  <line x1="20" y1="160" x2="300" y2="160" stroke="#333" stroke-width="6"/>
  <rect x="20" y="20" width="280" height="280" fill="none" stroke="#333" stroke-width="6"/>
  <!-- Các số đã cho -->
  <g font-family="system-ui" font-size="44" font-weight="bold" fill="#1565c0" text-anchor="middle">
    <text x="55" y="70">1</text><text x="125" y="70">3</text><text x="265" y="70">2</text>
    <text x="125" y="140">4</text><text x="265" y="140">1</text>
    <text x="125" y="210">1</text><text x="265" y="210">4</text>
    <text x="55" y="280">4</text><text x="125" y="280">2</text><text x="265" y="280">3</text>
  </g>
</svg>
