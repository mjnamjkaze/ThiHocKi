    <path d="M450,150 A100,100 0 0 1 450,350"/>
    <path d="M450,350 A100,100 0 0 1 250,350"/>
    <path d="M250,350 A100,100 0 0 1 250,150"/>
  </g>
  <g stroke="#333" stroke-width="2" font-family="system-ui" font-size="24" text-anchor="middle" font-weight="bold">
    <rect x="332" y="14" width="36" height="34" fill="#fff"/>
    <text x="350" y="39" stroke="none" fill="#333">E</text>
    <rect x="464" y="112" width="36" height="34" fill="#fff"/>
    <text x="482" y="137" stroke="none" fill="#333">B</text>
    <rect x="200" y="112" width="36" height="34" fill="#fff"/>
    <text x="218" y="137" stroke="none" fill="#333">C</text>
    <rect x="200" y="354" width="36" height="34" fill="#fff"/>
    <text x="218" y="379" stroke="none" fill="#333">D</text>
    <rect x="464" y="354" width="36" height="34" fill="#fff"/>
    <text x="482" y="379" stroke="none" fill="#333">A</text>
  </g>
  <!-- Start + mũi tên đi lên -->
