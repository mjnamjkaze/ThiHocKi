<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250">
  <rect x="0" y="0" width="700" height="250" fill="#fff" rx="8"/>
  <!-- Trái: đường thẳng cắt hình tròn tại 2 điểm -->
  <circle cx="170" cy="110" r="70" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="60" y1="150" x2="300" y2="70" stroke="#333" stroke-width="3"/>
  <circle cx="105" cy="135" r="7" fill="#e53935"/>
  <circle cx="237" cy="91" r="7" fill="#e53935"/>
  <text x="170" y="228" text-anchor="middle" font-family="system-ui" font-size="24" fill="#1565c0">Cắt nhau tại 2 điểm</text>
  <!-- Phải: hình tam giác cắt hình tròn -->
  <circle cx="500" cy="120" r="65" fill="none" stroke="#333" stroke-width="3"/>
  <polygon points="500,20 405,175 595,175" fill="none" stroke="#43a047" stroke-width="3"/>
  <text x="500" y="228" text-anchor="middle" font-family="system-ui" font-size="24" fill="#e53935">Cắt nhau tại ? điểm</text>
</svg>
