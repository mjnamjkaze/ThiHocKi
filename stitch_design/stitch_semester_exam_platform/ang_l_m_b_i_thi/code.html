<script>
        // Micro-interactions and Timer Logic
        let totalSeconds = 45 * 60 + 21;
        const timerElement = document.getElementById('exam-timer');

        function updateTimer() {
            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;
            
            const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            timerElement.textContent = timeString;

            if (totalSeconds < 300) { // Less than 5 minutes
                timerElement.classList.add('timer-warning');
            }

            if (totalSeconds > 0) {
                totalSeconds--;
            }
        }

        setInterval(updateTimer, 1000);

        // Hover & Focus effect for answer cards
        const answerButtons = document.querySelectorAll('article button.group');
        answerButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                answerButtons.forEach(b => {
                    b.classList.remove('border-primary', 'bg-primary-container/5');
                    b.classList.add('border-outline-variant');
                    const letterBox = b.querySelector('span:first-child');
                    letterBox.classList.remove('bg-primary', 'text-on-primary');
                    letterBox.classList.add('bg-surface-variant');
                });
                
                btn.classList.add('border-primary', 'bg-primary-container/5');
                btn.classList.remove('border-outline-variant');
                const selectedLetterBox = btn.querySelector('span:first-child');
                selectedLetterBox.classList.add('bg-primary', 'text-on-primary');
                selectedLetterBox.classList.remove('bg-surface-variant');
            });
        });
    </script>
